[project]
name = "reel-engine"
version = "0.1.0"
description = "Deterministic, CPU-only engine that turns photos, videos and a song into a beat-synced vertical reel"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "pillow>=10.3",
    "pillow-heif>=0.16",
    "librosa>=0.10.2",
    "soundfile>=0.12",
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
reel = "reel_engine.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["reel_engine*"]

[tool.setuptools.package-data]
reel_engine = ["presets.yaml", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["ffmpeg: needs ffmpeg/ffprobe on PATH", "network: calls external APIs"]
