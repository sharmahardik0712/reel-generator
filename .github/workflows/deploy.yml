name: Test and deploy

# Every push to main: run the tests, build the container image and check it starts,
# then deploy to Cloudflare Containers (https://reel.<you>.workers.dev).
# Needs repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (see DEPLOY.md).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  # Static FFmpeg from GitHub releases: fast to fetch on GitHub runners, unlike the
  # Ubuntu package mirror (which once took 28 minutes). Includes zscale and x265.
  FFMPEG_BUILD: ffmpeg-n9.0-latest-linux64-gpl-9.0

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/pyproject.toml
      - name: Install FFmpeg
        run: |
          curl -fsSL --retry 3 -o /tmp/ffmpeg.tar.xz \
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/${FFMPEG_BUILD}.tar.xz"
          tar -xJf /tmp/ffmpeg.tar.xz -C /tmp
          echo "/tmp/${FFMPEG_BUILD}/bin" >> "$GITHUB_PATH"
      - name: Check FFmpeg
        run: |
          ffmpeg -hide_banner -version | head -1
          ffmpeg -hide_banner -filters | grep -q " zscale "
          ffmpeg -hide_banner -encoders | grep -q " libx265 "
      - name: Install the engine
        run: pip install -e "engine[dev]"
      - name: Run tests
        # "network" tests call YouTube/iTunes; keep CI independent of them.
        run: python -m pytest engine/tests -m "not network" -q -W ignore::DeprecationWarning

  deploy:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Build the image
        run: docker build --platform linux/amd64 -t reel:ci .

      - name: Check the image starts and serves the app
        run: |
          docker run -d --name reel -p 8080:8080 reel:ci
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/api/config > /dev/null; then echo "app is up"; break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/api/config
          curl -fsS http://127.0.0.1:8080/ | grep -q "Reel Maker"
          docker logs reel
          docker rm -f reel

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare-container/package-lock.json

      - name: Deploy to Cloudflare
        working-directory: cloudflare-container
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm ci
          npx wrangler deploy

      - name: Start the switch-over to the new image
        # A running container keeps its old image until restarted. This asks the Worker
        # to restart it as soon as nothing is in use (a no-op if it's asleep or current).
        run: |
          sleep 15
          for i in 1 2 3 4 5; do
            if curl -fsS -X POST -A "Mozilla/5.0 (reel-ci)" \
                 https://makemyreel.in/__reel/deploy-check; then exit 0; fi
            sleep 15
          done
          echo "::warning::deploy-check ping failed; the next visitor will trigger the switch-over"
